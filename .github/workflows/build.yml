name: Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx expo prebuild --platform ios
      - run: pod install
        working-directory: ios
      - run: |
          cd ios
          xcodebuild build -workspace *.xcworkspace -scheme RecordApp -configuration Release -sdk iphoneos -derivedDataPath dv CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload && cp -r dv/Build/Products/Release-iphoneos/*.app Payload/ && zip -r app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ios/app.ipa
