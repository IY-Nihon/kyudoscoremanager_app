name: Daily Firestore Backup

on:
  schedule:
    - cron: '0 15 * * *' # 毎日 深夜0時 JST (= UTC 15:00)
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: read  # actions/checkout がリポジトリを読み取るために必要

concurrency:
  group: backup
  cancel-in-progress: false  # 実行中のバックアップを中断しない

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-backup-firebase-admin-12-googleapis-140
          restore-keys: |
            ${{ runner.os }}-backup-

      # バージョンを固定して予期しないアップデートを防ぐ
      - name: 📦 Install backup dependencies
        run: npm install --no-save firebase-admin@12 googleapis@140

      - name: 🔥 Run Firestore backup
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: node scripts/backup-firestore.mjs
